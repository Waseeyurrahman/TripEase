name: TripEase CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'   # 🔥 speeds up builds

      - name: Build & Test
        run: mvn clean install

      - name: Build Docker Image
        run: docker build -t tripease-app .